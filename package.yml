package: community.lazycat.app.salescompel
version: 0.1.0
name: SalesCompel
description: "Open-source free Salesforce alternative (clean-room recreation): Go/PostgreSQL platform with a Salesforce-compatible REST/OAuth API, multi-tenant records and an early Vue CRM UI (accounts, contacts, list and record workflows). Early 0.x preview."
min_os_version: 1.5.0
homepage: https://github.com/occupysaas/salescompel
author: occupysaas
license: Apache-2.0
permissions:
  required:
    - net.internet
